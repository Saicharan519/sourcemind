# SourceMind evaluation corpus.
#
# Every file must be redistributable. PDFs are NOT committed (*.pdf is gitignored);
# `python -m eval.corpus.download` fetches them and verifies the sha256 below.
# Run with --lock once to record hashes; after that any change fails the check.
#
# `group` is used to build cross-document unanswerable questions: a question
# generated from one group is asked against a document from a *different* group.

