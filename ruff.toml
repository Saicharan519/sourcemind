# Lint config. Scope is deliberately narrow for now: syntax errors, undefined
# names and unused imports. Widened as code is touched in later phases.
line-length = 110
target-version = "py311"
extend-exclude = [".worktrees", "frontend", "backend/.venv"]

[lint]
select = ["E9", "F63", "F7", "F82", "F401"]
